name: Build Executable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'build.spec'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'build.spec'
      - '.github/workflows/build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller build.spec
    
    - name: Test executable
      run: |
        .\dist\hintergrund.exe --help
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hintergrund-windows
        path: dist/hintergrund.exe
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/hintergrund.exe
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller build.spec
    
    - name: Test executable
      run: |
        ./dist/hintergrund --help
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hintergrund-linux
        path: dist/hintergrund
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/hintergrund
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build executable
      run: |
        pyinstaller build.spec
    
    - name: Test executable
      run: |
        ./dist/hintergrund --help
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hintergrund-macos
        path: dist/hintergrund
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/hintergrund
        name: Release ${{ github.ref_name }}
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
